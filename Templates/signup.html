<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up - Resumind</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-r from-blue-500 to-blue-100 min-h-screen flex items-center justify-center">

  <div class="bg-white/80 backdrop-blur-lg shadow-xl rounded-2xl p-8 w-full max-w-md">

    <!-- Logo / Title -->
    <h2 class="text-3xl font-bold text-center text-blue-600 mb-2">ResuMind</h2>
    <p class="text-center text-gray-500 mb-6">Create your account</p>

    <!-- Google Sign Up -->
  <button onclick="signUpWithGoogle()" 
class="w-full flex items-center justify-center gap-3 border py-2 rounded-lg 
hover:bg-gray-100 transition shadow-sm hover:shadow-md">
  
  <img src="https://www.svgrepo.com/show/475656/google-color.svg" 
       class="w-5 h-5">

  <span class="font-medium">Sign up with Google</span>

</button>
    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getAuth,createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup,updateProfile } 
      from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDpLSqe8YKSTAsoNOeuNop-X_R95aq5HoY",
      authDomain: "resumind-792e0.firebaseapp.com",
      projectId: "resumind-792e0",
      appId: "1:662992556232:web:9c405818206565e8ba15fd"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    window.signUpWithGoogle = function () {
      signInWithPopup(auth, provider)
        .then((result) => {
          const user = result.user;
          alert("Welcome " + user.displayName);
          window.location.href = "/dashboard";
        })
        .catch((error) => {
          console.log(error);
        });
    };
    window.signUpWithEmail = function () {

  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  createUserWithEmailAndPassword(auth, email, password)
    .then((userCredential) => {
      const user = userCredential.user;

      // Save full name
      updateProfile(user, {
        displayName: name
      });

      alert("Account created successfully!");

      window.location.href = "/dashboard";
    })
    .catch((error) => {
      alert(error.message);
    });
};
  </script>

    <!-- Divider -->
    <div class="flex items-center my-5">
      <hr class="flex-grow border-gray-300">
      <span class="mx-2 text-gray-400 text-sm">OR</span>
      <hr class="flex-grow border-gray-300">
    </div>

    <!-- Form -->
    <form>

      <input type="text" placeholder="Full Name"
        class="w-full mb-3 px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">

      <input type="email" placeholder="Email Address"
        class="w-full mb-3 px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">

      <div class="relative w-full mb-3">

  <input type="password" id="password"
    placeholder="Password"
    class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">

  <!-- Eye button -->
  <span onclick="togglePassword()" 
    class="absolute right-3 top-1/2 -translate-y-1/2 cursor-pointer text-gray-500">
    👁️
  </span>

</div>

      <button type="submit"
        class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">
        Create Account
      </button>
    </form>

    <!-- Login Redirect -->
    <p class="text-center text-sm text-gray-500 mt-5">
      Already have an account?
      <a href="#" class="text-blue-600 font-medium hover:underline">Login</a>
    </p>

  </div>
<script>
window.togglePassword = function () {
  const passwordInput = document.getElementById("password");

  if (passwordInput.type === "password") {
    passwordInput.type = "text";
  } else {
    passwordInput.type = "password";
  }
};
</script>
</body>
</html>
