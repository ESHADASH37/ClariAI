<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050a18;
            --accent-glow: rgba(56, 189, 248, 0.15);
            --glass-bg: rgba(30, 41, 59, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --electric-blue: #38bdf8;
            --input-bg: rgba(15, 23, 42, 0.6);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-deep);
            background-image: radial-gradient(circle at 50% 0%, var(--accent-glow) 0%, transparent 50%);
            color: var(--text-primary);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .support-container {
            max-width: 1000px;
            width: 100%;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header-section {
            text-align: center;
            margin-bottom: 60px;
        }

        h1 {
            font-size: 2.8rem;
            margin: 10px 0;
            background: linear-gradient(135deg, #fff 0%, var(--electric-blue) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Support Grid */
        .support-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }

        .support-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .support-card:hover {
            transform: translateY(-5px);
            border-color: var(--electric-blue);
        }

        .icon-box {
            width: 50px;
            height: 50px;
            background: rgba(56, 189, 248, 0.1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: var(--electric-blue);
        }

        /* Contact Form */
        .contact-section {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            max-width: 700px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        input, textarea {
            width: 100%;
            padding: 14px;
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: white;
            font-family: inherit;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--electric-blue);
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: var(--electric-blue);
            color: #050a18;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.3s, transform 0.2s;
        }

        .submit-btn:hover {
            opacity: 0.9;
            transform: scale(0.99);
        }

        .status-text {
            text-align: center;
            margin-top: 15px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

<div class="support-container">
    <div class="header-section">
        <h1>How can we help?</h1>
        <p style="color: var(--text-secondary)">Our team typically responds within 2 hours.</p>
    </div>

    <div class="support-grid">
        <div class="support-card">
            <div class="icon-box">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            </div>
            <h3>Live Chat</h3>
            <p style="color: var(--text-secondary); font-size: 0.9rem;">Available Mon-Fri<br>9am - 6pm EST</p>
        </div>

        <div class="support-card">
            <div class="icon-box">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            </div>
            <h3>Email Us</h3>
            <p style="color: var(--text-secondary); font-size: 0.9rem;">support@yourbrand.com<br>24/7 Monitoring</p>
        </div>

        <div class="support-card">
            <div class="icon-box">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
            </div>
            <h3>Help Docs</h3>
            <p style="color: var(--text-secondary); font-size: 0.9rem;">Browse 100+ articles<br>on every feature</p>
        </div>
    </div>

    <div class="contact-section">
        <h2 style="margin-top: 0; text-align: center;">Send a Message</h2>
        <form id="supportForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" placeholder="John Doe" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="john@example.com" required>
            </div>
            <div class="form-group">
                <label>Subject</label>
                <input type="text" placeholder="Technical Support" required>
            </div>
            <div class="form-group">
                <label>Message</label>
                <textarea rows="5" placeholder="How can we help?" required></textarea>
            </div>
            <button type="submit" class="submit-btn">Send Message</button>
            <p class="status-text">🔒 Your message is encrypted and secure.</p>
        </form>
    </div>
</div>

<script>
    document.getElementById('supportForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = this.querySelector('.submit-btn');
        btn.innerText = 'Sending...';
        
        // Simulate a delay for "professional" feel
        setTimeout(() => {
            btn.innerText = 'Message Sent! ✓';
            btn.style.background = '#10b981'; // Success Green
            this.reset();
        }, 1500);
    });
</script>

</body>
</html>
