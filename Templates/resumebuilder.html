<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResuMind| Optimize Your Career</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #2563eb;
      --primary-glow: rgba(37, 99, 235, 0.4);
      --accent: #00d4ff;
      --bg-dark: #020617;
      --card-bg: rgba(15, 23, 42, 0.7);
      --border: rgba(255, 255, 255, 0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      color: #f1f5f9;
      overflow-x: hidden;
      line-height: 1.6;
    }

    .bg-animation {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
      background: radial-gradient(circle at 0% 0%, #0f172a 0%, transparent 50%),
                  radial-gradient(circle at 100% 100%, #1e3a8a 0%, transparent 50%),
                  radial-gradient(circle at 50% 50%, #020617 0%, transparent 100%);
    }

    .container { max-width: 1100px; margin: 0 auto; padding: 40px 20px; position: relative; }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 40px;
      margin-bottom: 30px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }

    header { text-align: center; margin-bottom: 60px; }
    .logo-container {
      width: 70px; height: 70px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 0 30px var(--primary-glow);
    }
    header h1 { font-size: 3.5rem; font-weight: 800; letter-spacing: -2px; margin-bottom: 10px; }
    header p { color: #94a3b8; font-size: 1.2rem; }

    .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-bottom: 30px; }
    .label-box { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; color: var(--accent); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px; }
    
    textarea {
      width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border);
      border-radius: 18px; padding: 20px; color: white; font-family: inherit;
      resize: none; transition: all 0.3s ease;
    }
    textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }

    .upload-zone {
      border: 2px dashed var(--border); border-radius: 18px; padding: 30px;
      text-align: center; transition: 0.3s; cursor: pointer; background: rgba(255,255,255,0.02);
    }
    .upload-zone:hover { border-color: var(--primary); background: rgba(37, 99, 235, 0.05); }

    .btn-main {
      padding: 18px 40px; border-radius: 100px; border: none; font-weight: 700;
      cursor: pointer; transition: 0.4s; display: inline-flex; align-items: center; gap: 10px;
      background: linear-gradient(90deg, var(--primary), #4f46e5); color: white;
      box-shadow: 0 10px 20px var(--primary-glow);
    }
    .btn-main:hover { transform: translateY(-3px); box-shadow: 0 15px 30px var(--primary-glow); }

    .results-grid { display: flex; justify-content: center; gap: 50px; margin-bottom: 40px; }
    .score-card { text-align: center; }
    .score-circle-wrapper { position: relative; width: 150px; height: 150px; margin: 0 auto 10px; }
    .score-svg { transform: rotate(-90deg); width: 150px; height: 150px; }
    .score-bg { fill: none; stroke: rgba(255,255,255,0.1); stroke-width: 10; }
    .score-bar {
      fill: none; stroke: var(--accent); stroke-width: 10; stroke-linecap: round;
      stroke-dasharray: 440; stroke-dashoffset: 440; transition: stroke-dashoffset 1s ease-out;
    }
    .score-text {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: 2rem; font-weight: 800; color: white;
    }
    .sub-title { margin-bottom: 20px; color: #f1f5f9; display: flex; align-items: center; gap: 10px; }

    .project-item {
      background: rgba(255,255,255,0.03); border-radius: 15px; padding: 20px;
      margin-top: 15px; border-left: 4px solid var(--primary); display: flex; gap: 15px;
    }
    .project-item h4 { color: var(--accent); margin-bottom: 5px; }
    
    @media (max-width: 850px) { .input-grid { grid-template-columns: 1fr; } .results-grid { flex-direction: column; } }
  </style>
</head>

<body>
  <div class="bg-animation"></div>
  <div class="container">
    <header>
      <div class="logo-container"><i class="fas fa-bolt-lightning fa-2xl"></i></div>
      <h1><span style="color:var(--primary)">ResuMind</span></h1>
      <p>Precision-built resumes for high-growth careers.</p>
    </header>

    <div class="glass-card">
      <div class="input-grid">
        <div class="form-group">
          <div class="label-box"><i class="fas fa-file-invoice"></i> Current Resume</div>
          <textarea id="resume" rows="10" placeholder="Paste your professional experience..."></textarea>
        </div>
        <div class="form-group">
          <div class="label-box"><i class="fas fa-crosshairs"></i> Job Description</div>
          <textarea id="jd" rows="10" placeholder="Paste the target job requirements..."></textarea>
        </div>
      </div>

      <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
        <input type="file" id="fileInput" hidden>
        <i class="fas fa-cloud-arrow-up fa-2xl" style="color:var(--primary); margin-bottom:15px"></i>
        <p>Drop your PDF here or <strong>Browse Files</strong></p>
      </div>

      <div style="text-align: center; margin-top: 40px;">
        <button class="btn-main" onclick="analyzeResume()">
          <i class="fas fa-wand-magic-sparkles"></i> Analyze & Optimize
        </button>
      </div>
    </div>

    <div class="glass-card" id="results-section" style="display:none;">
      <h2 style="margin-bottom: 30px; text-align: center;">Analysis Report</h2>
      
      <div class="results-grid">
        <div class="score-card">
          <div class="score-circle-wrapper">
            <svg class="score-svg"><circle class="score-bg" cx="75" cy="75" r="70"></circle><circle id="atsBar" class="score-bar" cx="75" cy="75" r="70"></circle></svg>
            <div class="score-text" id="atsVal">0%</div>
          </div>
          <p>ATS Optimization</p>
        </div>

        <div class="score-card">
          <div class="score-circle-wrapper">
            <svg class="score-svg"><circle class="score-bg" cx="75" cy="75" r="70"></circle><circle id="matchBar" class="score-bar" cx="75" cy="75" r="70"></circle></svg>
            <div class="score-text" id="matchVal">0%</div>
          </div>
          <p>Job-Resume Match</p>
        </div>
      </div>

      <div id="dynamic-content">
          </div>
    </div>
  </div>

  <script>
    function animateScore(barId, textId, target) {
      const circle = document.getElementById(barId);
      const text = document.getElementById(textId);
      const radius = 70;
      const circumference = 2 * Math.PI * radius;
      
      circle.style.strokeDasharray = circumference;
      circle.style.strokeDashoffset = circumference - (target / 100) * circumference;
      
      let current = 0;
      const interval = setInterval(() => {
        if (current >= target) {
          text.innerText = target + "%";
          clearInterval(interval);
        } else {
          current++;
          text.innerText = current + "%";
        }
      }, 20);
    }

    async function analyzeResume() {
      const resumeText = document.getElementById('resume').value.trim();
      const jdText = document.getElementById('jd').value.trim();

      if (!resumeText || !jdText) {
        alert("Please provide both Resume and Job Description.");
        return;
      }

      const skillLibrary = ["Python", "JavaScript", "React", "Node.js", "SQL", "Docker", "AWS", "Kubernetes", "Machine Learning", "Tableau", "Git", "Agile", "REST API"];

      const foundInJD = skillLibrary.filter(skill => new RegExp(`\\b${skill}\\b`, 'gi').test(jdText));
      const foundInResume = foundInJD.filter(skill => new RegExp(`\\b${skill}\\b`, 'gi').test(resumeText));
      const missingSkills = foundInJD.filter(skill => !foundInResume.includes(skill));

      const matchScore = foundInJD.length > 0 ? Math.round((foundInResume.length / foundInJD.length) * 100) : 0;
      const atsScore = Math.min(100, Math.round((resumeText.length / 500) * 10 + (matchScore * 0.8)));

      document.getElementById('results-section').style.display = 'block';
      document.getElementById('results-section').scrollIntoView({ behavior: 'smooth' });

      animateScore('atsBar', 'atsVal', atsScore);
      animateScore('matchBar', 'matchVal', matchScore);

      renderDetails(foundInResume, missingSkills);
    }

    function renderDetails(found, missing) {
      const container = document.getElementById('dynamic-content');
      
      let html = `
        <div style="margin-bottom: 30px;">
            <h3 class="sub-title"><i class="fas fa-microchip"></i> Skill Gap Analysis</h3>
            <div style="display: flex; flex-wrap: wrap; gap: 10px;">
                ${found.map(s => `<span style="background:rgba(34,197,94,0.2); color:#4ade80; padding:6px 14px; border-radius:50px; border:1px solid #22c55e; font-size:0.85rem;"><i class="fas fa-check"></i> ${s}</span>`).join('')}
                ${missing.map(s => `<span style="background:rgba(239,68,68,0.2); color:#f87171; padding:6px 14px; border-radius:50px; border:1px solid #ef4444; font-size:0.85rem;"><i class="fas fa-times"></i> ${s}</span>`).join('')}
            </div>
        </div>
        <h3 class="sub-title"><i class="fas fa-lightbulb"></i> Recommended Projects</h3>
      `;

      if (missing.length === 0) {
        html += `<p style="color:#94a3b8">Your skills are a great match! No major gaps found.</p>`;
      } else {
        missing.slice(0, 3).forEach(skill => {
          html += `
            <div class="project-item">
              <div style="color:var(--primary); font-size: 1.5rem;"><i class="fas fa-code"></i></div>
              <div>
                <h4>${skill} Implementation Project</h4>
                <p style="color:#94a3b8; font-size:0.9rem;">Demonstrate your proficiency in ${skill} by building a specialized module. This directly addresses a requirement found in the job description.</p>
              </div>
            </div>
          `;
        });
      }
      container.innerHTML = html;
    }
  </script>
</body>
</html>
